services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      # Optional: `cp .env.example .env` to override any setting.
      - path: .env
        required: false
    volumes:
      - ./backend/app:/app/app
      - dem-cache:/app/.dem-cache

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  # Elevation grids survive container restarts; terrain does not change.
  dem-cache:
