name: FogMap
options:
  bundleIdPrefix: dev.weatherterrain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.32.0
  FogKit:
    path: ../FogKit

targets:
  FogMap:
    type: application
    platform: iOS
    sources:
      - FogMap
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: MapboxMaps
      - package: FogKit
        product: FogKit
      - package: FogKit
        product: FogRender
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FogMap/Info.plist
      properties:
        CFBundleDisplayName: SF Fog
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
